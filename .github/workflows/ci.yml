name: pytest-dart

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # check out my repo
      - name: Checkout airflow-dbt
        uses: actions/checkout@v4

      # Set up Python 
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      # install dependencies
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Run test
      - name: Run Pytest
        run: python -m pytest tests/dart -q
